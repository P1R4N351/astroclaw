<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Astroclaw logo</title>
  <desc id="desc">A round logo with three-lobed leaves, coiling tendrils, and a small purple flower cluster.</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#f3f7e8"/>
      <stop offset="100%" stop-color="#d9e6c7"/>
    </radialGradient>

    <linearGradient id="leafLight" x1="140" y1="120" x2="340" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8fbf75"/>
      <stop offset="100%" stop-color="#2f6f3f"/>
    </linearGradient>

    <linearGradient id="leafDark" x1="175" y1="135" x2="330" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5f9859"/>
      <stop offset="100%" stop-color="#174f31"/>
    </linearGradient>

    <linearGradient id="vine" x1="60" y1="70" x2="452" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6f9b4d"/>
      <stop offset="58%" stop-color="#2d6b3a"/>
      <stop offset="100%" stop-color="#153f2c"/>
    </linearGradient>

    <linearGradient id="flower" x1="322" y1="144" x2="388" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b995d0"/>
      <stop offset="100%" stop-color="#6f3b8b"/>
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173421" flood-opacity="0.22"/>
    </filter>

    <clipPath id="roundClip">
      <circle cx="256" cy="256" r="232"/>
    </clipPath>
  </defs>

  <g id="badge">
    <circle cx="256" cy="256" r="248" fill="#173421"/>
    <circle cx="256" cy="256" r="232" fill="url(#background)"/>
  </g>

  <g id="artwork" clip-path="url(#roundClip)">
    <g id="perimeter-vines" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 284C65 184 132 80 230 61c92-18 183 34 212 120 35 105-25 220-131 251-84 25-181-11-223-86"
            stroke="url(#vine)" stroke-width="18"/>
      <path d="M438 203c28 92-20 188-108 226-75 33-169 13-222-50"
            stroke="#75a85a" stroke-width="7" opacity="0.68"/>
      <path d="M87 291c-29-55-3-111 48-124 35-9 67 10 75 39 7 26-9 50-33 55-18 4-35-7-38-22-3-13 6-25 19-27"
            stroke="#2a6739" stroke-width="9"/>
      <path d="M398 126c29 17 43 53 31 82-10 24-38 35-58 22-17-11-20-35-6-48 11-10 29-8 36 3"
            stroke="#2f713d" stroke-width="8"/>
      <path d="M401 373c-19 37-63 53-96 35-26-14-36-48-20-70 13-18 40-21 54-6 11 12 10 31-2 40"
            stroke="#2f713d" stroke-width="8"/>
    </g>

    <g id="leaf-silhouette" filter="url(#softShadow)">
      <g id="left-leaflet">
        <path d="M242 281C205 287 159 275 124 241 94 212 83 172 96 139c39-1 76 15 100 45 27 33 43 70 46 97Z"
              fill="url(#leafLight)"/>
        <path d="M232 272C198 247 162 221 114 156" fill="none" stroke="#e5efd5" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
        <path d="M169 213c-9 6-21 10-37 11M190 235c-15 3-31 1-49-4M150 185c-5 11-13 20-24 28"
              fill="none" stroke="#2f6f3f" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      </g>

      <g id="right-leaflet">
        <path d="M270 280c35 9 82 2 121-27 34-25 51-63 43-98-38-7-78 3-107 28-32 27-52 62-57 97Z"
              fill="url(#leafLight)"/>
        <path d="M282 272c38-20 78-41 137-96" fill="none" stroke="#e5efd5" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
        <path d="M352 220c9 7 21 12 36 15M329 239c15 5 31 5 50 0M379 193c4 11 11 22 21 31"
              fill="none" stroke="#2f6f3f" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      </g>

      <g id="center-leaflet">
        <path d="M255 310C224 273 209 225 216 176c6-43 25-76 43-94 25 27 41 66 43 109 2 47-14 88-47 119Z"
              fill="url(#leafDark)"/>
        <path d="M255 293c2-56 4-115 4-184" fill="none" stroke="#edf4dc" stroke-width="7" stroke-linecap="round" opacity="0.76"/>
        <path d="M251 220c-17-12-29-27-38-46M263 224c16-13 29-29 40-48M251 257c-17-8-33-19-48-35M263 260c19-7 35-18 49-33"
              fill="none" stroke="#1d5734" stroke-width="4" stroke-linecap="round" opacity="0.58"/>
      </g>
    </g>

    <g id="stems" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M255 314C243 349 218 385 175 418" stroke="#1d5734" stroke-width="15"/>
      <path d="M256 314C296 348 337 371 388 381" stroke="#245f36" stroke-width="13"/>
      <path d="M256 314c5 43 1 80-15 114" stroke="#2f713d" stroke-width="10"/>
      <path d="M231 367c-29 2-54 17-66 39" stroke="#79a85b" stroke-width="5"/>
      <path d="M311 351c24-7 51-2 73 15" stroke="#79a85b" stroke-width="5"/>
    </g>

    <g id="flower-cluster">
      <path d="M344 236c8-32 10-67-7-103" fill="none" stroke="#315d35" stroke-width="7" stroke-linecap="round"/>
      <path d="M337 137c-14 15-23 29-26 43 15-2 28-10 39-25 9-13 7-24-13-18Z" fill="url(#flower)"/>
      <path d="M354 162c-18 10-31 22-38 35 16 2 31-3 45-15 12-11 12-23-7-20Z" fill="url(#flower)"/>
      <path d="M331 187c-16 11-26 24-30 38 15 0 29-7 41-20 10-12 8-23-11-18Z" fill="#8d56a7"/>
      <path d="M361 202c-17 7-30 17-39 30 15 4 30 1 44-9 13-9 14-20-5-21Z" fill="#75408e"/>
      <path d="M335 224c-12 8-20 18-24 29 12 1 23-4 32-14 8-9 7-18-8-15Z" fill="#9b68b5"/>
      <path d="M325 149c9 8 15 18 18 31M318 192c11 3 20 9 27 18M321 230c8 2 15 6 20 12"
            fill="none" stroke="#e5d4ec" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <g id="rim" fill="none">
    <circle cx="256" cy="256" r="232" stroke="#f8fbef" stroke-width="8" opacity="0.82"/>
    <circle cx="256" cy="256" r="248" stroke="#173421" stroke-width="16"/>
  </g>
</svg>
