name: Astroclaw
options:
  bundleIdPrefix: ai.astroclaw
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  AstroclawKit:
    path: ../shared/AstroclawKit
  Swabble:
    path: ../swabble

schemes:
  Astroclaw:
    shared: true
    build:
      targets:
        Astroclaw: all
    test:
      targets:
        - AstroclawTests
        - AstroclawLogicTests
  AstroclawLogicTests:
    shared: true
    build:
      targets:
        AstroclawLogicTests: all
    test:
      targets:
        - AstroclawLogicTests

targets:
  Astroclaw:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: AstroclawShareExtension
        embed: true
      - target: AstroclawActivityWidget
        embed: true
      - target: AstroclawWatchApp
      - package: AstroclawKit
      - package: AstroclawKit
        product: AstroclawChatUI
      - package: AstroclawKit
        product: AstroclawProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchExtension,$SRCROOT/../shared/AstroclawKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Astroclaw.entitlements
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ASTROCLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ASTROCLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASTROCLAW_PUSH_TRANSPORT: direct
          ASTROCLAW_PUSH_DISTRIBUTION: local
          ASTROCLAW_PUSH_RELAY_BASE_URL: ""
          ASTROCLAW_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          ASTROCLAW_PUSH_TRANSPORT: direct
          ASTROCLAW_PUSH_DISTRIBUTION: local
          ASTROCLAW_PUSH_RELAY_BASE_URL: ""
          ASTROCLAW_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Astroclaw
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.astroclaw.ios
            CFBundleURLSchemes:
              - astroclaw
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        AstroclawCanonicalVersion: "$(ASTROCLAW_IOS_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.astroclaw.ios.bgrefresh
        NSLocalNetworkUsageDescription: Astroclaw discovers and connects to your Astroclaw gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _astroclaw-gw._tcp
        NSCameraUsageDescription: Astroclaw can capture photos or short video clips when requested via the gateway.
        NSCalendarsUsageDescription: Astroclaw uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Astroclaw uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Astroclaw uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Astroclaw uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Astroclaw uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Astroclaw can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Astroclaw needs microphone access for voice wake.
        NSMotionUsageDescription: Astroclaw may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Astroclaw needs photo library access when you choose existing photos to share with your assistant.
        NSRemindersFullAccessUsageDescription: Astroclaw uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Astroclaw uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        AstroclawPushTransport: "$(ASTROCLAW_PUSH_TRANSPORT)"
        AstroclawPushDistribution: "$(ASTROCLAW_PUSH_DISTRIBUTION)"
        AstroclawPushRelayBaseURL: "$(ASTROCLAW_PUSH_RELAY_BASE_URL)"
        AstroclawPushAPNsEnvironment: "$(ASTROCLAW_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  AstroclawShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: AstroclawKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ASTROCLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ASTROCLAW_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Astroclaw Share
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  AstroclawActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/AstroclawActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ASTROCLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Astroclaw Activity
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AstroclawWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: AstroclawWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(ASTROCLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ASTROCLAW_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ASTROCLAW_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Astroclaw
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(ASTROCLAW_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  AstroclawWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(ASTROCLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ASTROCLAW_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ASTROCLAW_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Astroclaw
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(ASTROCLAW_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  AstroclawTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Astroclaw
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.astroclaw.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Astroclaw.app/Astroclaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: AstroclawTests
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"

  AstroclawLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: AstroclawKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ASTROCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ASTROCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.astroclaw.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: AstroclawLogicTests
        CFBundleShortVersionString: "$(ASTROCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(ASTROCLAW_BUILD_VERSION)"
