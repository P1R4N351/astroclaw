services:
  - type: web
    name: astroclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ASTROCLAW_GATEWAY_PORT
        value: "8080"
      - key: ASTROCLAW_STATE_DIR
        value: /data/.astroclaw
      - key: ASTROCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: ASTROCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: astroclaw-data
      mountPath: /data
      sizeGB: 1
